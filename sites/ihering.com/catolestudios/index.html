<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infographic Generator - Blazing Fast B-Roll Creator</title>
  <meta name="description" content="Create stunning animated infographics for B-rolls. Zero-config, edge-first, 60fps animations. Export in MP4, WebM, GIF, PNG or SVG.">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 10px;
    }
    
    ::-webkit-scrollbar-thumb {
      background: #888;
      border-radius: 10px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: #555;
    }
    
    .dark ::-webkit-scrollbar-track {
      background: #1f1f1f;
    }
    
    .dark ::-webkit-scrollbar-thumb {
      background: #4a4a4a;
    }
    
    .dark ::-webkit-scrollbar-thumb:hover {
      background: #6a6a6a;
    }
    
    /* Loading animation */
    .loading-spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #3b82f6;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* Smooth transitions */
    * {
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="min-h-screen bg-white flex items-center justify-center">
      <div class="text-center">
        <div class="loading-spinner mx-auto mb-4"></div>
        <p class="text-gray-600">Loading Infographic Generator...</p>
      </div>
    </div>
  </div>

  <!-- React and dependencies -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for JSX transformation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide React Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  
  <!-- FFmpeg.wasm for video encoding -->
  <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
  
  <!-- Load advanced modules -->
  <script src="/i18n.js"></script>
  <script src="/protection.js"></script>
  <script src="/video-exporter.js"></script>
  <script src="/animation-engine.js"></script>
  <script src="/chart-library.js"></script>
  <script src="/storyteller-engine.js"></script>
  <script src="/epic-storyteller.js"></script>
  <script src="/example-datasets.js"></script>
  
  <script>
    // Initialize protection
    if (window.CodeProtection) {
      CodeProtection.init({
        allowedDomains: [], // Add your domains
        licenseKey: 'CATOLE-DEMO-2024',
        enableAntiDebug: false, // Set true in production
        watermark: false,
        obfuscation: 'low'
      });
    }
    
    // Initialize i18n
    if (window.i18n) {
      // Auto-detect language
      const lang = window.i18n.detectLanguage();
      window.i18n.setLanguage(lang);
    }
  </script>
  
  <script type="text/babel" data-type="module">
    const { useState, useRef, useEffect, useCallback } = React;
    
    // Import Lucide icons
    const { 
      Play, 
      Download, 
      Upload, 
      Settings, 
      Palette, 
      Clock, 
      Film, 
      Sparkles, 
      ChevronDown, 
      Copy, 
      FileJson, 
      FileSpreadsheet, 
      Loader2,
      Pause,
      RotateCw,
      Save,
      Share2,
      Maximize,
      Moon,
      Sun
    } = lucide;
    
    // Create icon components
    const createIcon = (Icon) => {
      return ({ className, ...props }) => {
        const ref = useRef(null);
        useEffect(() => {
          if (ref.current) {
            ref.current.innerHTML = '';
            const icon = Icon.createElement();
            icon.setAttribute('class', className || '');
            Object.keys(props).forEach(key => {
              if (key !== 'children') {
                icon.setAttribute(key, props[key]);
              }
            });
            ref.current.appendChild(icon);
          }
        }, [className]);
        return React.createElement('span', { ref, ...props });
      };
    };
    
    const PlayIcon = createIcon(Play);
    const DownloadIcon = createIcon(Download);
    const UploadIcon = createIcon(Upload);
    const SettingsIcon = createIcon(Settings);
    const PaletteIcon = createIcon(Palette);
    const ClockIcon = createIcon(Clock);
    const FilmIcon = createIcon(Film);
    const SparklesIcon = createIcon(Sparkles);
    const ChevronDownIcon = createIcon(ChevronDown);
    const CopyIcon = createIcon(Copy);
    const FileJsonIcon = createIcon(FileJson);
    const FileSpreadsheetIcon = createIcon(FileSpreadsheet);
    const Loader2Icon = createIcon(Loader2);
    const PauseIcon = createIcon(Pause);
    const RotateCwIcon = createIcon(RotateCw);
    const SaveIcon = createIcon(Save);
    const Share2Icon = createIcon(Share2);
    const MaximizeIcon = createIcon(Maximize);
    const MoonIcon = createIcon(Moon);
    const SunIcon = createIcon(Sun);
    
    // Load the main component
    fetch('/infographic-generator.tsx')
      .then(response => response.text())
      .then(code => {
        // Remove TypeScript types and convert to JSX
        const jsxCode = code
          .replace(/: [\w\[\]<>{}|&,\s]+(?=[,;)\]}])/g, '') // Remove type annotations
          .replace(/interface \w+[\s\S]*?^}/gm, '') // Remove interfaces
          .replace(/type \w+[\s\S]*?^}/gm, '') // Remove type definitions
          .replace(/as \w+/g, '') // Remove type assertions
          .replace(/export default/g, ''); // Remove export statement
        
        // Execute the component code
        eval(Babel.transform(jsxCode, { presets: ['react'] }).code);
        
        // Mount the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(InfographicGenerator));
      })
      .catch(error => {
        console.error('Failed to load component:', error);
        
        // Fallback: Include the component directly
        const InfographicGenerator = () => {
          const canvasRef = useRef(null);
          const mediaRecorderRef = useRef(null);
          const chunksRef = useRef([]);
          const [isGenerating, setIsGenerating] = useState(false);
          const [isPlaying, setIsPlaying] = useState(false);
          const [progress, setProgress] = useState(0);
          const [isRecording, setIsRecording] = useState(false);
          const [ffmpegLoaded, setFfmpegLoaded] = useState(false);
          
          const [config, setConfig] = useState({
            type: 'bar',
            title: 'Quarterly Revenue Growth',
            subtitle: 'FY 2024 Performance Metrics',
            dataSource: 'Internal Analytics',
            data: {
              labels: ['Q1', 'Q2', 'Q3', 'Q4'],
              datasets: [{
                label: 'Revenue (M)',
                data: [12, 19, 23, 28],
                backgroundColor: ['#374151', '#6B7280', '#9CA3AF', '#D1D5DB'],
              }]
            },
            palette: { 
              name: 'Neutral', 
              colors: ['#374151', '#6B7280', '#9CA3AF', '#D1D5DB', '#E5E7EB', '#F3F4F6'] 
            },
            template: 'corporate',
            animation: {
              type: 'fade',
              easing: 'easeInOut',
              duration: 2000,
              delay: 0,
              stagger: 100,
              loop: false,
              segmentDuration: 500,
            },
            export: {
              format: 'mp4',
              resolution: '1080p',
              framerate: 60,
              duration: 5,
              quality: 'high',
              compression: false,
              proxyVersion: false,
            },
            theme: 'light',
          });
          
          const colorPalettes = [
            { name: 'Neutral', colors: ['#374151', '#6B7280', '#9CA3AF', '#D1D5DB', '#E5E7EB', '#F3F4F6'] },
            { name: 'Vibrant', colors: ['#EF4444', '#F97316', '#FCD34D', '#84CC16', '#06B6D4', '#8B5CF6'] },
            { name: 'Solar', colors: ['#FEF3C7', '#FDE68A', '#FCD34D', '#FBBF24', '#F59E0B', '#D97706'] },
            { name: 'Ocean', colors: ['#E0F2FE', '#BAE6FD', '#7DD3FC', '#38BDF8', '#0EA5E9', '#0284C7'] },
            { name: 'Pastel', colors: ['#FEE2E2', '#FECACA', '#FCA5A5', '#F87171', '#EF4444', '#DC2626'] },
            { name: 'Monochrome', colors: ['#F9FAFB', '#F3F4F6', '#E5E7EB', '#D1D5DB', '#9CA3AF', '#6B7280'] },
            { name: 'Forest', colors: ['#DCFCE7', '#BBF7D0', '#86EFAC', '#4ADE80', '#22C55E', '#16A34A'] },
            { name: 'Sunset', colors: ['#FEF2F2', '#FEE2E2', '#FECACA', '#FCA5A5', '#F87171', '#EF4444'] },
          ];
          
          const templates = {
            corporate: { animation: { type: 'fade', easing: 'easeInOut', duration: 1500 }, palette: 'Neutral' },
            social: { animation: { type: 'bounce', easing: 'easeOutBounce', duration: 2000 }, palette: 'Vibrant' },
            educational: { animation: { type: 'slide', easing: 'easeInOutQuad', duration: 1800 }, palette: 'Ocean' },
            minimal: { animation: { type: 'fade', easing: 'linear', duration: 1000 }, palette: 'Monochrome' },
            vibrant: { animation: { type: 'spring', easing: 'easeOutElastic', duration: 2500 }, palette: 'Vibrant' },
            technical: { animation: { type: 'scale', easing: 'easeInOutCubic', duration: 1600 }, palette: 'Neutral' },
            finance: { animation: { type: 'slide', easing: 'easeInOutQuart', duration: 1400 }, palette: 'Forest' },
            health: { animation: { type: 'smooth', easing: 'easeInOutSine', duration: 2000 }, palette: 'Ocean' },
          };
          
          // Easing functions
          const easingFunctions = {
            linear: (t) => t,
            easeIn: (t) => t * t,
            easeOut: (t) => t * (2 - t),
            easeInOut: (t) => t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t,
            easeInQuad: (t) => t * t,
            easeOutQuad: (t) => t * (2 - t),
            easeInOutQuad: (t) => t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t,
            easeInCubic: (t) => t * t * t,
            easeOutCubic: (t) => (--t) * t * t + 1,
            easeInOutCubic: (t) => t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1,
            easeInQuart: (t) => t * t * t * t,
            easeOutQuart: (t) => 1 - (--t) * t * t * t,
            easeInOutQuart: (t) => t < 0.5 ? 8 * t * t * t * t : 1 - 8 * (--t) * t * t * t,
            easeInQuint: (t) => t * t * t * t * t,
            easeOutQuint: (t) => 1 + (--t) * t * t * t * t,
            easeInOutQuint: (t) => t < 0.5 ? 16 * t * t * t * t * t : 1 + 16 * (--t) * t * t * t * t,
            easeInSine: (t) => 1 - Math.cos((t * Math.PI) / 2),
            easeOutSine: (t) => Math.sin((t * Math.PI) / 2),
            easeInOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
            easeInExpo: (t) => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
            easeOutExpo: (t) => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
            easeInOutExpo: (t) => t === 0 ? 0 : t === 1 ? 1 : t < 0.5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
            easeInCirc: (t) => 1 - Math.sqrt(1 - Math.pow(t, 2)),
            easeOutCirc: (t) => Math.sqrt(1 - Math.pow(t - 1, 2)),
            easeInOutCirc: (t) => t < 0.5 ? (1 - Math.sqrt(1 - Math.pow(2 * t, 2))) / 2 : (Math.sqrt(1 - Math.pow(-2 * t + 2, 2)) + 1) / 2,
            easeOutBounce: (t) => {
              const n1 = 7.5625;
              const d1 = 2.75;
              if (t < 1 / d1) {
                return n1 * t * t;
              } else if (t < 2 / d1) {
                return n1 * (t -= 1.5 / d1) * t + 0.75;
              } else if (t < 2.5 / d1) {
                return n1 * (t -= 2.25 / d1) * t + 0.9375;
              } else {
                return n1 * (t -= 2.625 / d1) * t + 0.984375;
              }
            },
            easeInBounce: (t) => 1 - easingFunctions.easeOutBounce(1 - t),
            easeInOutBounce: (t) => t < 0.5
              ? (1 - easingFunctions.easeOutBounce(1 - 2 * t)) / 2
              : (1 + easingFunctions.easeOutBounce(2 * t - 1)) / 2,
            easeOutElastic: (t) => {
              const c4 = (2 * Math.PI) / 3;
              return t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
            },
            easeInElastic: (t) => {
              const c4 = (2 * Math.PI) / 3;
              return t === 0 ? 0 : t === 1 ? 1 : -Math.pow(2, 10 * t - 10) * Math.sin((t * 10 - 10.75) * c4);
            },
            easeInOutElastic: (t) => {
              const c5 = (2 * Math.PI) / 4.5;
              return t === 0 ? 0 : t === 1 ? 1 : t < 0.5
                ? -(Math.pow(2, 20 * t - 10) * Math.sin((20 * t - 11.125) * c5)) / 2
                : (Math.pow(2, -20 * t + 10) * Math.sin((20 * t - 11.125) * c5)) / 2 + 1;
            },
            easeOutBack: (t) => {
              const c1 = 1.70158;
              const c3 = c1 + 1;
              return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
            },
          };
          
          // Canvas rendering function
          const renderChart = useCallback((ctx, progress) => {
            const { width, height } = ctx.canvas;
            const theme = config.theme === 'dark' || (config.theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            
            // Clear canvas
            ctx.fillStyle = theme ? '#000000' : '#FFFFFF';
            ctx.fillRect(0, 0, width, height);
            
            // Apply easing
            const easedProgress = easingFunctions[config.animation.easing](progress);
            
            // Title
            const titleOpacity = Math.min(easedProgress * 2, 1);
            ctx.fillStyle = theme ? `rgba(255, 255, 255, ${titleOpacity})` : `rgba(0, 0, 0, ${titleOpacity})`;
            ctx.font = 'bold 48px Inter, system-ui, -apple-system, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(config.title, width / 2, 80);
            
            // Subtitle
            if (easedProgress > 0.2) {
              const subtitleOpacity = Math.min((easedProgress - 0.2) * 2, 1);
              ctx.fillStyle = theme ? `rgba(200, 200, 200, ${subtitleOpacity})` : `rgba(100, 100, 100, ${subtitleOpacity})`;
              ctx.font = '24px Inter, system-ui, -apple-system, sans-serif';
              ctx.fillText(config.subtitle, width / 2, 120);
            }
            
            // Chart area
            const chartArea = {
              x: 100,
              y: 180,
              width: width - 200,
              height: height - 280,
            };
            
            // Render based on chart type
            if (config.type === 'bar') {
              renderBarChart(ctx, chartArea, easedProgress, theme);
            } else if (config.type === 'line') {
              renderLineChart(ctx, chartArea, easedProgress, theme);
            } else if (config.type === 'pie') {
              renderPieChart(ctx, chartArea, easedProgress, theme);
            }
            
            // Data source
            if (easedProgress > 0.8) {
              const footerOpacity = Math.min((easedProgress - 0.8) * 5, 1);
              ctx.fillStyle = theme ? `rgba(150, 150, 150, ${footerOpacity})` : `rgba(120, 120, 120, ${footerOpacity})`;
              ctx.font = '14px Inter, system-ui, -apple-system, sans-serif';
              ctx.textAlign = 'right';
              ctx.fillText(`Source: ${config.dataSource}`, width - 50, height - 30);
            }
          }, [config]);
          
          // Bar chart renderer
          const renderBarChart = (ctx, area, progress, isDark) => {
            const data = config.data.datasets[0].data;
            const labels = config.data.labels;
            const barWidth = area.width / (labels.length * 2);
            const maxValue = Math.max(...data);
            
            // Draw axes
            ctx.strokeStyle = isDark ? '#444' : '#DDD';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(area.x, area.y + area.height);
            ctx.lineTo(area.x + area.width, area.y + area.height);
            ctx.moveTo(area.x, area.y);
            ctx.lineTo(area.x, area.y + area.height);
            ctx.stroke();
            
            // Draw bars
            data.forEach((value, index) => {
              const barHeight = (value / maxValue) * area.height * progress;
              const x = area.x + (index * 2 + 0.5) * barWidth;
              const y = area.y + area.height - barHeight;
              
              const staggerDelay = config.animation.stagger * index;
              const staggerProgress = Math.max(0, Math.min(1, (progress * config.animation.duration - staggerDelay) / (config.animation.duration - staggerDelay * data.length)));
              
              if (staggerProgress > 0) {
                ctx.fillStyle = config.palette.colors[index % config.palette.colors.length];
                ctx.fillRect(x, y, barWidth, barHeight * staggerProgress);
                
                if (staggerProgress > 0.5) {
                  ctx.fillStyle = isDark ? '#FFF' : '#000';
                  ctx.font = 'bold 16px Inter, system-ui, -apple-system, sans-serif';
                  ctx.textAlign = 'center';
                  ctx.fillText(value.toString(), x + barWidth / 2, y - 10);
                }
                
                ctx.fillStyle = isDark ? '#AAA' : '#666';
                ctx.font = '14px Inter, system-ui, -apple-system, sans-serif';
                ctx.fillText(labels[index], x + barWidth / 2, area.y + area.height + 25);
              }
            });
          };
          
          // Line chart renderer
          const renderLineChart = (ctx, area, progress, isDark) => {
            const data = config.data.datasets[0].data;
            const labels = config.data.labels;
            const maxValue = Math.max(...data);
            const pointSpacing = area.width / (labels.length - 1);
            
            // Draw axes
            ctx.strokeStyle = isDark ? '#444' : '#DDD';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(area.x, area.y + area.height);
            ctx.lineTo(area.x + area.width, area.y + area.height);
            ctx.moveTo(area.x, area.y);
            ctx.lineTo(area.x, area.y + area.height);
            ctx.stroke();
            
            // Draw line
            ctx.strokeStyle = config.palette.colors[0];
            ctx.lineWidth = 3;
            ctx.beginPath();
            
            const drawLength = data.length * progress;
            for (let i = 0; i < drawLength; i++) {
              const x = area.x + i * pointSpacing;
              const y = area.y + area.height - (data[i] / maxValue) * area.height;
              
              if (i === 0) {
                ctx.moveTo(x, y);
              } else {
                const prevX = area.x + (i - 1) * pointSpacing;
                const prevY = area.y + area.height - (data[i - 1] / maxValue) * area.height;
                const partialProgress = drawLength - Math.floor(drawLength);
                
                if (i < Math.floor(drawLength)) {
                  ctx.lineTo(x, y);
                } else {
                  const currentX = prevX + (x - prevX) * partialProgress;
                  const currentY = prevY + (y - prevY) * partialProgress;
                  ctx.lineTo(currentX, currentY);
                }
              }
            }
            ctx.stroke();
            
            // Draw points
            for (let i = 0; i < Math.min(data.length, Math.floor(drawLength) + 1); i++) {
              const x = area.x + i * pointSpacing;
              const y = area.y + area.height - (data[i] / maxValue) * area.height;
              
              ctx.fillStyle = config.palette.colors[0];
              ctx.beginPath();
              ctx.arc(x, y, 6, 0, Math.PI * 2);
              ctx.fill();
              
              if (progress > 0.5) {
                ctx.fillStyle = isDark ? '#FFF' : '#000';
                ctx.font = 'bold 14px Inter, system-ui, -apple-system, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(data[i].toString(), x, y - 15);
              }
              
              ctx.fillStyle = isDark ? '#AAA' : '#666';
              ctx.font = '14px Inter, system-ui, -apple-system, sans-serif';
              ctx.fillText(labels[i], x, area.y + area.height + 25);
            }
          };
          
          // Pie chart renderer
          const renderPieChart = (ctx, area, progress, isDark) => {
            const data = config.data.datasets[0].data;
            const labels = config.data.labels;
            const total = data.reduce((sum, val) => sum + val, 0);
            const centerX = area.x + area.width / 2;
            const centerY = area.y + area.height / 2;
            const radius = Math.min(area.width, area.height) / 2 - 40;
            
            let currentAngle = -Math.PI / 2;
            const animatedTotal = total * progress;
            let accumulatedValue = 0;
            
            data.forEach((value, index) => {
              const sliceValue = Math.min(value, Math.max(0, animatedTotal - accumulatedValue));
              const sliceAngle = (sliceValue / total) * Math.PI * 2;
              
              if (sliceValue > 0) {
                ctx.fillStyle = config.palette.colors[index % config.palette.colors.length];
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, currentAngle, currentAngle + sliceAngle);
                ctx.closePath();
                ctx.fill();
                
                if (progress > 0.5 && value === sliceValue) {
                  const labelAngle = currentAngle + sliceAngle / 2;
                  const labelX = centerX + Math.cos(labelAngle) * (radius * 0.7);
                  const labelY = centerY + Math.sin(labelAngle) * (radius * 0.7);
                  
                  ctx.fillStyle = '#FFFFFF';
                  ctx.font = 'bold 16px Inter, system-ui, -apple-system, sans-serif';
                  ctx.textAlign = 'center';
                  ctx.textBaseline = 'middle';
                  ctx.fillText(`${labels[index]}`, labelX, labelY - 10);
                  ctx.fillText(`${Math.round((value / total) * 100)}%`, labelX, labelY + 10);
                }
              }
              
              currentAngle += sliceAngle;
              accumulatedValue += value;
            });
          };
          
          // Animation loop
          useEffect(() => {
            if (!isPlaying || !canvasRef.current) return;
            
            const ctx = canvasRef.current.getContext('2d');
            if (!ctx) return;
            
            const startTime = Date.now();
            const duration = config.export.duration * 1000;
            let animationId;
            
            const animate = () => {
              const elapsed = Date.now() - startTime;
              const progress = Math.min(elapsed / config.animation.duration, 1);
              
              renderChart(ctx, progress);
              setProgress(progress);
              
              if (progress < 1) {
                animationId = requestAnimationFrame(animate);
              } else if (config.animation.loop && elapsed < duration) {
                animationId = requestAnimationFrame(() => {
                  const loopProgress = ((elapsed % config.animation.duration) / config.animation.duration);
                  renderChart(ctx, loopProgress);
                  setProgress(loopProgress);
                  animate();
                });
              } else {
                setIsPlaying(false);
              }
            };
            
            animate();
            
            return () => {
              if (animationId) cancelAnimationFrame(animationId);
            };
          }, [isPlaying, config, renderChart]);
          
          // Export video using MediaRecorder
          const exportVideo = async () => {
            setIsGenerating(true);
            
            try {
              const canvas = canvasRef.current;
              if (!canvas) return;
              
              // Set canvas dimensions
              const dimensions = {
                '1080p': { width: 1920, height: 1080 },
                '4k': { width: 3840, height: 2160 },
                '8k': { width: 7680, height: 4320 },
                'custom': { width: 1920, height: 1080 },
              };
              
              const { width, height } = dimensions[config.export.resolution];
              canvas.width = width;
              canvas.height = height;
              
              const ctx = canvas.getContext('2d');
              if (!ctx) return;
              
              // Setup MediaRecorder
              const stream = canvas.captureStream(config.export.framerate);
              const mimeType = config.export.format === 'webm' ? 'video/webm;codecs=vp9' : 'video/mp4';
              
              const options = {
                mimeType: MediaRecorder.isTypeSupported(mimeType) ? mimeType : 'video/webm',
                videoBitsPerSecond: config.export.quality === 'ultra' ? 40000000 :
                                    config.export.quality === 'high' ? 20000000 :
                                    config.export.quality === 'medium' ? 10000000 : 5000000
              };
              
              const mediaRecorder = new MediaRecorder(stream, options);
              const chunks = [];
              
              mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) {
                  chunks.push(e.data);
                }
              };
              
              mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: mimeType });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${config.title.replace(/\s+/g, '_')}.${config.export.format === 'mp4' ? 'mp4' : 'webm'}`;
                a.click();
                URL.revokeObjectURL(url);
                
                // Generate proxy version
                if (config.export.proxyVersion) {
                  const proxyBlob = new Blob(chunks.slice(0, Math.floor(chunks.length / 2)), { type: mimeType });
                  const proxyUrl = URL.createObjectURL(proxyBlob);
                  setTimeout(() => {
                    const proxyLink = document.createElement('a');
                    proxyLink.href = proxyUrl;
                    proxyLink.download = `${config.title.replace(/\s+/g, '_')}_proxy.${config.export.format === 'mp4' ? 'mp4' : 'webm'}`;
                    proxyLink.click();
                    URL.revokeObjectURL(proxyUrl);
                  }, 1000);
                }
                
                setIsGenerating(false);
                setProgress(0);
              };
              
              // Start recording
              mediaRecorder.start();
              setIsRecording(true);
              
              // Animate and record
              const fps = config.export.framerate;
              const totalFrames = config.export.duration * fps;
              const frameTime = 1000 / fps;
              let frame = 0;
              
              const recordFrame = () => {
                if (frame < totalFrames) {
                  const progress = (frame / fps) / config.export.duration;
                  renderChart(ctx, Math.min(progress * (config.export.duration * 1000 / config.animation.duration), 1));
                  setProgress((frame + 1) / totalFrames);
                  frame++;
                  setTimeout(recordFrame, frameTime);
                } else {
                  mediaRecorder.stop();
                  setIsRecording(false);
                }
              };
              
              recordFrame();
              
            } catch (error) {
              console.error('Export failed:', error);
              alert('Video export failed. Your browser might not support this feature. Try using Chrome or Edge.');
              setIsGenerating(false);
              setProgress(0);
            }
          };
          
          // Export image
          const exportImage = () => {
            const canvas = canvasRef.current;
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            if (!ctx) return;
            
            // Set high quality dimensions
            const dimensions = {
              '1080p': { width: 1920, height: 1080 },
              '4k': { width: 3840, height: 2160 },
              '8k': { width: 7680, height: 4320 },
              'custom': { width: 1920, height: 1080 },
            };
            
            const { width, height } = dimensions[config.export.resolution];
            canvas.width = width;
            canvas.height = height;
            
            // Render at full progress
            renderChart(ctx, 1);
            
            canvas.toBlob((blob) => {
              if (!blob) return;
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = `${config.title.replace(/\s+/g, '_')}.png`;
              a.click();
              URL.revokeObjectURL(url);
            }, 'image/png', 1.0);
          };
          
          // Import data handler
          const handleImportData = (e) => {
            const file = e.target.files?.[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (event) => {
              try {
                const content = event.target?.result;
                let parsedData;
                
                if (file.name.endsWith('.json')) {
                  parsedData = JSON.parse(content);
                } else if (file.name.endsWith('.csv')) {
                  const lines = content.split('\n').filter(line => line.trim());
                  const headers = lines[0].split(',').map(h => h.trim());
                  const values = lines[1] ? lines[1].split(',').map(v => parseFloat(v.trim())) : [];
                  parsedData = {
                    labels: headers,
                    datasets: [{
                      label: 'Imported Data',
                      data: values,
                      backgroundColor: config.palette.colors,
                    }]
                  };
                }
                
                setConfig(prev => ({ ...prev, data: parsedData }));
              } catch (error) {
                console.error('Import failed:', error);
                alert('Failed to import data. Please check the file format.');
              }
            };
            reader.readAsText(file);
          };
          
          // Paste handler
          const handlePaste = async () => {
            try {
              const text = await navigator.clipboard.readText();
              
              // Try JSON parse
              try {
                const jsonData = JSON.parse(text);
                if (jsonData.labels && jsonData.datasets) {
                  setConfig(prev => ({ ...prev, data: jsonData }));
                  return;
                }
              } catch {}
              
              // Try tab-separated values
              const lines = text.trim().split('\n');
              if (lines.length >= 2) {
                const labels = lines[0].split('\t').map(l => l.trim());
                const values = lines[1].split('\t').map(v => parseFloat(v.trim()));
                
                if (labels.length === values.length && values.every(v => !isNaN(v))) {
                  setConfig(prev => ({
                    ...prev,
                    data: {
                      labels,
                      datasets: [{
                        label: 'Pasted Data',
                        data: values,
                        backgroundColor: prev.palette.colors,
                      }]
                    }
                  }));
                }
              }
            } catch (error) {
              console.error('Paste failed:', error);
            }
          };
          
          return (
            <div className={`min-h-screen ${config.theme === 'dark' ? 'dark bg-black text-white' : 'bg-white text-black'} transition-colors duration-300`}>
              <div className="max-w-7xl mx-auto p-6">
                {/* Header */}
                <div className="mb-8 text-center">
                  <div className="mb-4">
                    <span className="text-xs font-mono text-gray-500 dark:text-gray-400 uppercase tracking-widest">
                      Catolé Studios Opus
                    </span>
                  </div>
                  <h1 className="text-5xl font-bold mb-2 bg-gradient-to-r from-blue-600 via-purple-600 to-pink-600 bg-clip-text text-transparent">
                    Infographic Generator & Visual Storyteller
                  </h1>
                  <p className="text-gray-600 dark:text-gray-400 mb-4">
                    Blazing fast • Zero-config • Edge-first • 60fps animations • Walt Disney Physics™
                  </p>
                  <div className="flex justify-center gap-2">
                    <button className="px-4 py-2 bg-gradient-to-r from-blue-600 to-purple-600 text-white rounded-lg text-sm font-medium">
                      📊 Data Mode
                    </button>
                    <button 
                      onClick={() => alert('Storyteller Mode - Coming Next!')}
                      className="px-4 py-2 bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-lg text-sm font-medium"
                    >
                      ✨ Storyteller Mode
                    </button>
                    <button className="px-4 py-2 bg-gradient-to-r from-green-600 to-emerald-600 text-white rounded-lg text-sm font-medium">
                      🎬 Studio Mode
                    </button>
                  </div>
                </div>
                
                {/* Main Grid */}
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                  {/* Controls */}
                  <div className="space-y-4">
                    {/* Chart Type */}
                    <div className="bg-gray-50 dark:bg-gray-900 rounded-xl p-4 border border-gray-200 dark:border-gray-800">
                      <label className="block text-sm font-medium mb-2">Chart Type</label>
                      <select 
                        value={config.type}
                        onChange={(e) => setConfig(prev => ({ ...prev, type: e.target.value }))}
                        className="w-full px-3 py-2 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg"
                      >
                        <option value="bar">Bar Chart</option>
                        <option value="line">Line Chart</option>
                        <option value="pie">Pie Chart</option>
                      </select>
                    </div>
                    
                    {/* Template */}
                    <div className="bg-gray-50 dark:bg-gray-900 rounded-xl p-4 border border-gray-200 dark:border-gray-800">
                      <label className="block text-sm font-medium mb-2">Template</label>
                      <div className="grid grid-cols-2 gap-2">
                        {Object.keys(templates).map((template) => (
                          <button
                            key={template}
                            onClick={() => {
                              const tmpl = templates[template];
                              setConfig(prev => ({
                                ...prev,
                                template,
                                animation: { ...prev.animation, ...tmpl.animation },
                                palette: colorPalettes.find(p => p.name === tmpl.palette) || prev.palette,
                              }));
                            }}
                            className={`px-3 py-2 rounded-lg text-sm font-medium transition-all ${
                              config.template === template
                                ? 'bg-blue-600 text-white'
                                : 'bg-gray-200 dark:bg-gray-800'
                            }`}
                          >
                            {template.charAt(0).toUpperCase() + template.slice(1)}
                          </button>
                        ))}
                      </div>
                    </div>
                    
                    {/* Color Palette */}
                    <div className="bg-gray-50 dark:bg-gray-900 rounded-xl p-4 border border-gray-200 dark:border-gray-800">
                      <label className="block text-sm font-medium mb-2">Color Palette</label>
                      <div className="space-y-2">
                        {colorPalettes.map((palette) => (
                          <button
                            key={palette.name}
                            onClick={() => setConfig(prev => ({ ...prev, palette }))}
                            className={`w-full px-3 py-2 rounded-lg flex items-center justify-between ${
                              config.palette.name === palette.name
                                ? 'bg-blue-100 dark:bg-blue-900 border-2 border-blue-500'
                                : 'bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700'
                            }`}
                          >
                            <span className="text-sm">{palette.name}</span>
                            <div className="flex gap-1">
                              {palette.colors.slice(0, 5).map((color, i) => (
                                <div key={i} className="w-4 h-4 rounded" style={{ backgroundColor: color }} />
                              ))}
                            </div>
                          </button>
                        ))}
                      </div>
                    </div>
                    
                    {/* Export Settings */}
                    <div className="bg-gray-50 dark:bg-gray-900 rounded-xl p-4 border border-gray-200 dark:border-gray-800">
                      <label className="block text-sm font-medium mb-2">Export Settings</label>
                      <div className="space-y-3">
                        <select
                          value={config.export.format}
                          onChange={(e) => setConfig(prev => ({
                            ...prev,
                            export: { ...prev.export, format: e.target.value }
                          }))}
                          className="w-full px-2 py-1 text-sm bg-white dark:bg-gray-800 border rounded"
                        >
                          <option value="mp4">MP4 Video</option>
                          <option value="webm">WebM Video</option>
                          <option value="png">PNG Image</option>
                        </select>
                        
                        <select
                          value={config.export.resolution}
                          onChange={(e) => setConfig(prev => ({
                            ...prev,
                            export: { ...prev.export, resolution: e.target.value }
                          }))}
                          className="w-full px-2 py-1 text-sm bg-white dark:bg-gray-800 border rounded"
                        >
                          <option value="1080p">1080p</option>
                          <option value="4k">4K</option>
                          <option value="8k">8K</option>
                        </select>
                        
                        <div className="flex items-center gap-2">
                          <input
                            type="checkbox"
                            id="proxy"
                            checked={config.export.proxyVersion}
                            onChange={(e) => setConfig(prev => ({
                              ...prev,
                              export: { ...prev.export, proxyVersion: e.target.checked }
                            }))}
                            className="rounded"
                          />
                          <label htmlFor="proxy" className="text-sm">Generate proxy version</label>
                        </div>
                      </div>
                    </div>
                  </div>
                  
                  {/* Preview */}
                  <div className="lg:col-span-2 space-y-4">
                    {/* Canvas */}
                    <div className="bg-gray-50 dark:bg-gray-900 rounded-xl p-6 border border-gray-200 dark:border-gray-800">
                      <canvas
                        ref={canvasRef}
                        width={1920}
                        height={1080}
                        className="w-full h-auto rounded-lg shadow-lg"
                        style={{ maxHeight: '500px', objectFit: 'contain' }}
                      />
                      
                      {/* Progress */}
                      {(isPlaying || isGenerating) && (
                        <div className="mt-4">
                          <div className="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2">
                            <div
                              className="bg-gradient-to-r from-blue-500 to-purple-500 h-2 rounded-full transition-all"
                              style={{ width: `${progress * 100}%` }}
                            />
                          </div>
                        </div>
                      )}
                    </div>
                    
                    {/* Data Input */}
                    <div className="bg-gray-50 dark:bg-gray-900 rounded-xl p-4 border border-gray-200 dark:border-gray-800">
                      <div className="flex justify-between items-center mb-3">
                        <label className="text-sm font-medium">Data</label>
                        <div className="flex gap-2">
                          <button onClick={handlePaste} className="px-3 py-1 text-sm bg-gray-200 dark:bg-gray-800 rounded-lg">
                            <CopyIcon className="w-4 h-4 inline mr-1" />
                            Paste
                          </button>
                          <label className="px-3 py-1 text-sm bg-gray-200 dark:bg-gray-800 rounded-lg cursor-pointer">
                            <UploadIcon className="w-4 h-4 inline mr-1" />
                            Import
                            <input type="file" accept=".json,.csv" onChange={handleImportData} className="hidden" />
                          </label>
                        </div>
                      </div>
                      
                      <textarea
                        value={JSON.stringify(config.data, null, 2)}
                        onChange={(e) => {
                          try {
                            const data = JSON.parse(e.target.value);
                            setConfig(prev => ({ ...prev, data }));
                          } catch {}
                        }}
                        className="w-full px-3 py-2 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg font-mono text-xs"
                        rows={6}
                      />
                    </div>
                    
                    {/* Actions */}
                    <div className="flex gap-3">
                      <button
                        onClick={() => setIsPlaying(!isPlaying)}
                        className="flex-1 px-6 py-3 bg-gradient-to-r from-blue-600 to-purple-600 text-white font-medium rounded-xl hover:from-blue-700 hover:to-purple-700 transition-all"
                      >
                        {isPlaying ? <PauseIcon className="w-5 h-5 inline mr-2" /> : <PlayIcon className="w-5 h-5 inline mr-2" />}
                        {isPlaying ? 'Pause' : 'Preview'}
                      </button>
                      
                      <button
                        onClick={config.export.format === 'png' ? exportImage : exportVideo}
                        disabled={isGenerating}
                        className="flex-1 px-6 py-3 bg-gradient-to-r from-green-600 to-emerald-600 text-white font-medium rounded-xl disabled:opacity-50"
                      >
                        {isGenerating ? (
                          <>
                            <Loader2Icon className="w-5 h-5 inline mr-2 animate-spin" />
                            {isRecording ? 'Recording...' : 'Generating...'}
                          </>
                        ) : (
                          <>
                            <DownloadIcon className="w-5 h-5 inline mr-2" />
                            Export {config.export.format.toUpperCase()}
                          </>
                        )}
                      </button>
                      
                      <button
                        onClick={() => setConfig(prev => ({
                          ...prev,
                          theme: prev.theme === 'light' ? 'dark' : 'light'
                        }))}
                        className="px-4 py-3 bg-gray-200 dark:bg-gray-800 rounded-xl"
                      >
                        {config.theme === 'light' ? <MoonIcon className="w-5 h-5" /> : <SunIcon className="w-5 h-5" />}
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          );
        };
        
        // Mount the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(InfographicGenerator));
      });
  </script>
</body>
</html>
