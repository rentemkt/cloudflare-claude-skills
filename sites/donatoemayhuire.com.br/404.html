<!DOCTYPE html>
<html lang="pt-BR">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada - Donato e Mayhuire</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 60px 40px;
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        .clinic-name {
            font-size: 14px;
            color: #0099cc;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .error-code {
            font-size: 120px;
            font-weight: 700;
            color: #0099cc;
            line-height: 1;
            margin-bottom: 20px;
        }

        .error-title {
            font-size: 32px;
            font-weight: 600;
            color: #2c2c2c;
            margin-bottom: 15px;
        }

        .error-description {
            font-size: 16px;
            color: #666;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .home-link {
            display: inline-block;
            background-color: #0099cc;
            color: white;
            padding: 14px 40px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 16px;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .home-link:hover {
            background-color: #0077aa;
            transform: translateY(-2px);
        }

        .home-link:active {
            transform: translateY(0);
        }

        .divider {
            height: 1px;
            background-color: #e0e0e0;
            margin: 40px 0;
        }

        .footer-text {
            font-size: 13px;
            color: #999;
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 30px;
            }

            .error-code {
                font-size: 80px;
            }

            .error-title {
                font-size: 24px;
            }

            .error-description {
                font-size: 15px;
            }

            .home-link {
                padding: 12px 35px;
                font-size: 15px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            .error-code {
                font-size: 60px;
                margin-bottom: 15px;
            }

            .error-title {

            }

<link rel="canonical" href="https://donatoemayhuire.com.br/404.html" />
